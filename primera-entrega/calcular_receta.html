<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Adolfo Moran de la Vega, Franco Torres">
    <meta name="description" content="Calculadora de porciones para las diferentes recetas">
    <meta name="keywords" content="recetas, cocina, sopa, sandwich, ensalada">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript" src="script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="imagenes/favicon.png">
    <link rel="stylesheet" href="style.css" type="text/css">
    <title>Recetario web S.E.S</title>
</head>

<body onload="mostrarReceta(), cantidadPorciones(), recetasCortas();">
    <div id="contenedor-header">
        <header id="header-principal">
            <a href="lore.html" id="logo-sitio">
                <img src="imagenes/logo_header.png" alt="Sándwich, Sopa o Ensalada">
            </a>
            <h1 id="titulo-sitio">Recetario web S.E.S</h1>
            <nav id="nav-principal">
                <a href="index.html" id="hlink-inicio">Inicio</a>
                <a href="recetas.html" id="hlink-recetas" class="link-activo">Recetas</a>
                <a href="contacto.html" id="hlink-contacto">Contacto</a>
            </nav>
        </header>
    </div>

    <main id="contenido-principal" class="pagina-calcular">
        <button type="button" id="boton-volver-recetas" onclick="volverRecetas()">
            ← Volver a recetas
        </button>
        <section id="informacion-recetas">
            <aside id="img-receta" class="imagen-receta">
            </aside>

            <div id="texto-receta">

                <span id="categoria-receta" class="etiqueta-plato"></span>

                <h3 id="nombre-plato">

                </h3>
                <p id="descripcion-receta">

                </p>

                <hr>

                <div class="datos-adicionales">
                    <div class="dato">
                        <h6>TIEMPO</h6>
                        <p id="tiempo"></p>
                    </div>
                    <div class="dato">
                        <h6>CANTIDAD PORCIONES</h6>
                        <p id="cantidad"></p>
                    </div>
                </div>
            </div>
        </section>

        <div id="receta">
            <div class="columna-izquierda">
                <div class="calculadora-porciones">
                    <h5>
                        Calcular Porciones
                    </h5>
                    <div class="controles-calculadora">
                        <label for="input-porciones" class="label-calculadora">Calculadora</label>
                        <input type="number" value="1" id="input-porciones" min="1" size="5"
                            aria-label="Número base de porciones">
                        <button type="button" aria-label="Calcular ingredientes para el número de porciones elegido"
                            onclick="cantidadPorciones(), mostrarReceta();">
                            Calcular
                        </button>
                    </div>
                </div>

                <div class="lista-ingredientes">
                    <h5>
                        Ingredientes
                    </h5>
                    <ul id="ingredientes">

                    </ul>
                </div>
            </div>

            <div id="columna-derecha">
                <h5>
                    Preparación
                </h5>
                <ol id="pasos" class="lista-pasos">

                </ol>
            </div>
        </div>

        <hr class="separador">

        <div class="otras-recetas">
            <div class="texto-superior">
                <h5>
                    Más Recetas
                </h5>
                <a href="recetas.html" class="ver-todo">Ver todo &rarr;</a>
            </div>
            <div id="recetas-cortas" class="grid-recetas">

            </div>
        </div>
    </main>

    <div id="contenedor-footer">
        <footer id="footer-principal">

            <nav id="nav-texto">
                <h6>S.E.S. cocina</h6>
                <p id="frase-footer">La cocina no discute teorías, las prueba.</p>
            </nav>

            <nav id="nav-sitio">
                <a href="index.html" id="flink-inicio">Inicio</a>

                <a href="recetas.html" id="flink-recetas">Recetas</a>

                <a href="contacto.html" id="flink-contacto">Contacto</a>
            </nav>

        </footer>
    </div>
</body>

</html>
