<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Adolfo Moran de la Vega, Franco Torres">
    <meta name="description" content="Recetario web que te ayuda a decidir qué cocinar. 
        Cuenta con calculadora de porciones, checklist de ingredientes y distintos filtros">
    <meta name="keywords" content="recetas, cocina, sopa, sándwich, ensalada">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css" type="text/css">
    <link rel="icon" type="image/png" href="imagenes/favicon.png">
    <title>Recetario S.E.S</title>
</head>

<body onload="CargarDestacadas();">
    <div id="contenedor-header">
        <header id="header-principal">
            <img src="imagenes/logo_header.png" alt="Sándwich, Sopa o Ensalada" id="logo-sitio">
            <h1 id="titulo-sitio">Recetario S.E.S</h1>
            <nav id="nav-principal">
                <a href="index.html" id="hlink-inicio" class="link-activo">Inicio</a>
                <a href="recetas.html" id="hlink-recetas">Recetas</a>
                <a href="contacto.html" id="hlink-contacto">Contacto</a>
            </nav>
        </header>
    </div>
    <main id="contenido-principal">
        <section id="hero">
            <div id="texto-hero">
                <h2>¿Qué cocinamos hoy?</h2>
                <p>Encontrá la receta perfecta para lo que tenés ganas de comer.</p>
                <div id="buscador">
                    <label for="input-buscar-recetas">Buscar recetas</label>
                    <input type="text" id="input-buscar-recetas" name="buscar-recetas"
                        placeholder="Ej: milanesa, sopa de calabaza..." size="30" maxlength="40">
                    <button type="button" id="boton-buscar" onclick="filtrarReceta()">Buscar</button>
                </div>
            </div>
        </section>
        <div id="contenedor-destacadas">
            <section id="recetas-destacadas">
                <h2>Recetas destacadas</h2>
                <div id="carrusel-destacadas">
                    <button type="button" id="boton-flecha-izquierda" aria-label="Receta anterior"
                        onclick="moverCarrusel('izquierda')">‹</button>
                    <div id="ventana-destacadas">
                        <div id="lista-destacadas">
                        </div>
                    </div>
                    <button type="button" id="boton-flecha-derecha" aria-label="Receta siguiente"
                        onclick="moverCarrusel('derecha')">›</button>
                </div>
            </section>
        </div>
    </main>
    <div id="contenedor-footer">
        <footer id="footer-principal">
            <div id="nav-texto">
                <h6>S.E.S. cocina</h6>
                <p id="frase-footer">La cocina no discute teorías, las prueba.</p>
            </div>

            <nav id="nav-sitio">
                <a href="index.html" id="flink-inicio">Inicio</a>
                <a href="recetas.html" id="flink-recetas">Recetas</a>
                <a href="contacto.html" id="flink-contacto">Contacto</a>
            </nav>
        </footer>
    </div>
    <script type="text/javascript" src="script.js"></script>
</body>

</html>
